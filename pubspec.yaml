name: commute_guardian
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# THE BUILD NUMBER IS THE versionCode ANDROID INSTALLS, AND IT ONLY GOES UP.
#
# It was `+1` for a year while the phone in this room ran versionCode 2002, and
# the reason is NOT a stray `--build-number` on somebody's command line. Flutter
# rewrites the versionCode when an APK is split per ABI:
# `abiVersionCode * 1000 + versionCode`, arm64 being 2 (FlutterPlugin.kt). So
# `+2` built with `--split-per-abi` installed as 2002.
#
# That offset is exactly the lie this project has just spent a day removing: the
# app can only print the number in this line, and Android would install a
# different one. So `tool/build_apk.ps1` builds ONE ABI with --target-platform
# and never splits, and then the two numbers are the same number.
#
# 4004 because the 3T already carries 4003, from the one split build made while
# this was being worked out. Android refuses anything lower as a downgrade.
#
# Bump this line for every build a tester is given. The script reads it, gradle
# reads it (`versionCode = flutter.versionCode`), and the app reads it back
# through BuildInfo, so all three agree by construction.
version: 1.0.0+4005

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.3
  geofencing_api: ^2.0.0
  flutter_foreground_task: ^9.2.2
  path_provider: ^2.1.5
  fl_location: ^5.0.0
  audio_session: ^0.2.4
  # Wake escalation alarm tone. Chosen over just_audio for its per-player
  # audio context: the tone rides the Android ALARM stream and the iOS
  # playback category without touching the TTS ducking session.
  audioplayers: ^6.1.0
  vibration: ^3.1.3
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  battery_plus: ^7.1.1
  flutter_riverpod: ^2.6.1
  sentry_flutter: 9.26.0
  aptabase_flutter: ^0.5.0
  # Direct because IsolateEventQueue implements aptabase_flutter's own
  # StorageManager against it, to give each isolate its own event queue. It was
  # already here transitively, through both aptabase_flutter and
  # flutter_foreground_task.
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.4
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/stations/mumbai_suburban.json
    # Generated by tool/build_alarm_tone.py, never hand-edited.
    - assets/audio/wake_alarm.wav
    # Generated by tool/build_sarvam_clips.py (welcome_en, bulbul:v3, ritu),
    # never hand-edited. The spoken greeting at the top of every English ride.
    - assets/audio/welcome_greeting.wav
    # Generated by tool/build_pulse_chime.py, never hand-edited. Pocket Pulse's
    # reassurance sound. Bundled rather than synthesised at runtime so it can be
    # replaced without a code change, which is also the path Guardian Plus sells
    # chime variants down.
    - assets/audio/pulse_chime.wav
    # THE ENGLISH CLIP PACK, and the answer to the delivery question ADR 0001
    # left open since July. This comment used to say the single 75KB greeting
    # "must not quietly grow into a bundled pack", and it was right for as
    # long as the pack was raw WAV: 891 files and 128.7 MB cannot go in an
    # APK. 32 kbps mono AAC measures 9.5x smaller, so the whole pack is
    # 13.5 MB, which fits with room to spare and needs no asset pack, no
    # download and no server.
    #
    # THIS IS WHAT MADE A CLOSED BETA POSSIBLE. The pack used to arrive by
    # `adb push` into the app's external files dir, and on Android 11+ that
    # directory is unreachable without a laptop, so a volunteer could never
    # be handed one and rode on the device TTS floor instead.
    #
    # Generated by tool/build_clip_assets.py, NEVER hand-edited. That script
    # also drops clips that measure longer than their sentence predicts, so
    # what is bundled here is smaller than what build/sarvam_clips holds.
    - assets/clips/en-IN/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
